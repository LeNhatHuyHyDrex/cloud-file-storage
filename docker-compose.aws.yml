# Ghi de cho moi truong AWS: dung Amazon S3 that thay cho SeaweedFS.
# Tren EC2, file .env dat COMPOSE_FILE=docker-compose.yml:docker-compose.aws.yml nen
# `docker compose up -d` tu dong ap dung file nay. Thong tin dang nhap S3 lay tu IAM role cua EC2.
services:
  seaweedfs:
    profiles: ["local-s3"]   # khong chay tren AWS

  app:
    depends_on: !override
      postgres:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ""
      S3_PUBLIC_ENDPOINT: ""
      S3_ACCESS_KEY: ""      # rong -> DefaultCredentialsProvider (IAM instance profile)
      S3_SECRET_KEY: ""
      S3_PATH_STYLE: "false"
    ports: !override
      - "127.0.0.1:8080:8080" # chi Caddy (HTTPS) duoc vao app
