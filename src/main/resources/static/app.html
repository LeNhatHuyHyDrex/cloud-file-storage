<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nimbus Drive</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo"></span> Nimbus Drive</div>
    <button class="btn primary block" id="btn-upload-side"><span data-icon="upload"></span> Upload</button>
    <nav class="nav" id="nav">
      <button data-view="files" class="active"><span data-icon="home"></span>My files</button>
      <button data-view="recent"><span data-icon="clock"></span>Recent</button>
      <button data-view="starred"><span data-icon="star"></span>Starred</button>
      <button data-view="shared"><span data-icon="link"></span>Shared links</button>
    </nav>
    <div class="storage-card" id="storage">
      <div class="row"><b>Storage</b><span class="small muted" id="storage-text">—</span></div>
      <div class="bar" id="storage-bar"></div>
      <div class="legend" id="storage-legend"></div>
      <div class="backend-pill" id="backend-pill">storage</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btn-menu" aria-label="Menu"><span data-icon="menu"></span></button>
      <div class="search input-icon">
        <span data-icon="search"></span>
        <input class="input" id="search" type="search" placeholder="Search all your files..." autocomplete="off">
        <span class="kbd">/</span>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btn-theme" title="Toggle light/dark theme"><span data-icon="moon"></span></button>
      <button class="avatar" id="btn-user" title="Account">?</button>
    </header>

    <section class="content" id="content">
      <div class="page-head">
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <div class="view-toggle">
          <button class="icon-btn active" data-layout="grid" title="Grid view"><span data-icon="grid"></span></button>
          <button class="icon-btn" data-layout="list" title="List view"><span data-icon="list"></span></button>
        </div>
        <button class="btn" id="btn-new-folder"><span data-icon="folderPlus"></span><span>New folder</span></button>
        <button class="btn primary" id="btn-upload"><span data-icon="upload"></span><span>Upload</span></button>
      </div>
      <div id="view"></div>
    </section>
  </div>
</div>

<input type="file" id="file-input" multiple hidden>

<div class="drop-overlay hidden" id="drop">
  <div class="box"><span data-icon="upload"></span><h3>Drop files to upload</h3><div class="muted" id="drop-target">to My files</div></div>
</div>

<div class="uploads hidden" id="uploads">
  <div class="uploads-head"><span id="uploads-title">Uploading</span><div class="spacer"></div>
    <button class="icon-btn" id="uploads-close" title="Close"><span data-icon="x"></span></button></div>
  <div class="uploads-list" id="uploads-list"></div>
</div>

<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
